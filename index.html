<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe5">
  <meta name="description" content="Одно маленькое сердце. Целое дерево любви. Открой открытку и коснись сердца.">
  <title>Из одного сердца</title>
  <link rel="icon" href="./assets/heart.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/tree.css">
</head>
<body>
  <main id="card" class="card" tabindex="-1" aria-label="Из одного сердца — живая открытка">
    <canvas id="garden" aria-hidden="true"></canvas>
    <button id="seed" class="seed" type="button" aria-label="Нажми — вырастить дерево любви">
      <span class="invitation">Нажми</span>
      <svg class="seed-heart" viewBox="-1.2 -1.2 2.4 2.4" aria-hidden="true">
        <defs><linearGradient id="ruby" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ed657b"/><stop offset=".46" stop-color="#d83b5b"/><stop offset="1" stop-color="#ae2345"/></linearGradient></defs>
        <path fill="url(#ruby)" d="M0 .85C-.18 .69-1 .13-1-.36C-1-.96-.25-1.04 0-.48C.25-1.04 1-.96 1-.36C1 .13.18 .69 0 .85Z"/>
      </svg>
    </button>
    <div id="controls" class="controls" hidden>
      <button id="pause" type="button" aria-label="Приостановить анимацию" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M9 6v12M15 6v12"/></svg></button>
      <button id="replay" type="button" aria-label="Повторить открытку"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9a7.5 7.5 0 1 1-.2 5M5 4v5h5"/></svg></button>
    </div>
    <p id="status" class="sr-only" role="status" aria-live="polite">Нажмите на сердце, чтобы вырастить дерево с розовыми и красными листьями-сердечками.</p>
    <noscript><p class="no-script">Чтобы сердце превратилось в дерево, включите JavaScript.</p></noscript>
  </main>
  <script type="module" src="./assets/tree-app.js"></script>
</body>
</html>
